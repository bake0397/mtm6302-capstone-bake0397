<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capstone Project</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google font; Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- Header -->
    <header id="top">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-black" aria-label="Main navigation">
            <div class="container">
                <!-- Logo on the Left -->
                <a class="navbar-logo" href="#">
                    <img src="./images/logo.svg" alt="Logo" width="200" height="50"
                        class="d-inline-block align-text-center">
                </a>

                <!-- Mobile Menu Button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Nav Links on the Right -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">About APOD</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="calendar-link" href="#" aria-label="Open APOD calendar">Calendar</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#favourites">My Favourites</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- APOD Display -->
    <section class="hero position-relative">
        <img id="apod-image" src="./images/hero-apod.png" class="img-fluid w-100" alt="Hero Image">
        <div class="hero-text position-absolute top-0 start-0 text-white p-4">
            <p id="apod-date-display">Todays Date</p>
        </div>
        <!-- Heart/Favourite Button -->
        <button id="favourite-btn" class="btn btn-light position-absolute bottom-0 end-0 m-3 rounded-circle heart-btn">
            <i class="bi bi-heart"></i>
        </button>
    </section>

    <!-- ARCHIVE SECTION -->
    <section class="archive-section py-4 bg-white">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between">
            <!-- H2 -->
            <h2 class="archive-title mb-3 mb-md-0 text-black fw-semibold">Archive Photo of the Day</h2>

            <!-- Select Date Form -->
            <form id="apod-form" class="d-flex align-items-center gap-2 mb-0">
                <label for="apod-date" class="visually-hidden">Choose a date</label>
                <input type="date" id="apod-date" required>
                <!-- Select Date Button -->
                <button type="submit"
                    class="btn btn-dark bg-black rounded-pill archive-btn px-4 py-1 d-flex align-items-center">
                    <!-- Fetches selected APOD -->
                    <span id="select">Submit</span>
                </button>
            </form>
        </div>
    </section>

    <!-- ABOUT SECTION -->
    <section>
        <div class="pt-4 container-fluid bg-black">
            <div class="bg-white text-black">
                <h3 id="apod-title" class="p-3 d-flex">About Todays Photo</h3>
            </div>
            <div class="p-4 text-white">
                <p id="apod-explanation">
                    <!-- JS inserets photo details here -->
                </p>
            </div>
        </div>
    </section>

    <!-- Decorative divider -->
    <section>
        <div class="p-4 container-fluid">
            <img src="./images/stars.svg" alt="">
        </div>
    </section>

    <!-- FAVOURITES SECTION -->
    <section id="favourites">
        <div class="container-fluid bg-black">
            <h3 class="p-3 mb-3 text-white">My Favourites</h3>
        </div>
        <div id="favourites-list" class="p-3">
            <!-- JS inserts favourited images here -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black text-white py-4">
        <div class="container">
            <div class="row align-items-start">
                <!-- Logo Column -->
                <div class="col-md-4 mb-3 mb-md-0">
                    <img src="./images/logo.svg" alt="Logo" class="img-fluid">
                </div>

                <!-- Footer Nav Column -->
                <div class="col-md-4 offset-md-4 footer-nav">
                    <ul class="list-unstyled m-0 p-0">
                        <li class="footer-link border-bottom">
                            <a href="#" class="text-white text-decoration-none d-block py-2">About APOD</a>
                        </li>
                        <li class="footer-link border-bottom">
                            <a id="calendar-link-footer" href="#" class="text-white text-decoration-none d-block py-2"
                                aria-label="Open APOD calendar">Calendar</a>
                        </li>
                        <li class="footer-link border-bottom">
                            <a href="#favourites" class="text-white text-decoration-none d-block py-2">My Favourites</a>
                        </li>
                        <li class="footer-link border-top">
                            <a href="#" class="text-white text-decoration-none d-block py-2">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <a href="#top" id="back-to-top" class="btn btn-light border border-2 border-dark rounded-pill position-fixed end-0 bottom-0 m-3 d-none text-black">
            Back to top
        </a>

        <!-- Favourite Images Modal -->
        <div id="apod-modal" aria-modal="true" aria-hidden="true" aria-label="Favourite image details"></div>

        <!-- Navigation Calendar Modal -->
        <div id="calendar-modal" role="dialog" aria-modal="true"
            aria-label="Choose date for Astronomy Picture of the Day" aria-hidden="true"></div>
    </footer>

    <!-- JavaScript -->

    <!-- BBOOTSTRAP JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- CUSTOM JavaScript -->
    <script src="script.js"></script>
</body>

</html>
